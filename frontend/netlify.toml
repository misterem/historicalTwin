# Netlify site for twin.maxaltman.com. In the Netlify UI, set the base directory to
# `frontend`; everything else comes from this file.

[build]
  command = "npm run build"
  # The app is a plain static export (output: "export"), so publish out/ directly.
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  # A static export doesn't need Netlify's Next.js adapter. When it was auto-applied it
  # expected publish = ".next"; on this site it didn't run at all and .next was published
  # raw (404 at /). Skipping it makes the deploy the same either way.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  # Baked into the bundle at build time (see frontend/README.md).
  NEXT_PUBLIC_API_URL = "https://historicaltwin-api-590976791342.us-central1.run.app"
