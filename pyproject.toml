[project]
name = "paintmatch"
version = "0.1.0"
description = "Find the portrait painting that looks most like you."
requires-python = ">=3.11,<3.13"
dependencies = [
    "insightface==0.7.3",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "pillow>=10.3",
    "huggingface_hub>=0.24",
    "tqdm>=4.66",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paintmatch"]

[dependency-groups]
dev = [
    "boto3>=1.43.109",
]
